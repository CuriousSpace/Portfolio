<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WebSocket/STOMP Debug Console</title>
  <style>
    body {
      margin: 0;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: linear-gradient(180deg, #f7f9ff 0%, #eef2ff 100%);
      color: #111827;
    }

    .page {
      max-width: 920px;
      margin: 0 auto;
      padding: 48px 24px;
    }

    .card {
      background: #fff;
      border: 1px solid #dbe1ef;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 32px;
    }

    p {
      margin: 0 0 10px;
      line-height: 1.7;
      color: #4b5563;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin-top: 28px;
    }

    a {
      display: block;
      padding: 18px 20px;
      border-radius: 18px;
      text-decoration: none;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1d4ed8;
      font-weight: 700;
    }

    a span {
      display: block;
      margin-top: 6px;
      color: #475569;
      font-size: 13px;
      font-weight: 500;
    }

    code {
      background: #f3f4f6;
      padding: 2px 6px;
      border-radius: 6px;
    }

    @media (max-width: 720px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <section class="card">
      <h1>WebSocket/STOMP Debug Console</h1>
      <p>언어별 HTML을 분리한 WebSocket/STOMP 디버그 콘솔 진입 페이지입니다.</p>
      <p>실행 전 정적 서버를 먼저 띄우세요. 예: <code>python3 -m http.server 3000</code></p>

      <div class="grid">
        <a href="./index-ko.html">
          한국어 버전
          <span>한글 라벨과 한글 로그 메시지로 테스트하는 버전</span>
        </a>
        <a href="./index-en.html">
          English Version
          <span>English labels and English log messages for demos and portfolio use</span>
        </a>
      </div>
    </section>
  </div>
</body>
</html>
